<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Questão 04 - Jogadores</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body class="bg-light py-4">

  <div class="container">
    <h1 class="text-center mb-4">⚽ Jogadores da Copa 2026</h1>

    <div class="d-flex flex-wrap gap-4 justify-content-center" id="lista-jogadores">

      <!-- Card do Vinicius Junior (card original) -->
      <div class="card" style="width: 18rem;">
        <img src="img/_vinicius_junior.png" class="card-img-top" alt="Vinicius Junior"/>
        <div class="card-body">
          <h5 class="card-title">Vinicius José Paixão de Oliveira Júnior</h5>
          <ul class="list-group list-group-flush">
            <li class="list-group-item">📅 Data de Nasc.: <span id="data-nasc-1">12/07/2000 (25 anos)</span></li>
            <li class="list-group-item">📏 Altura: <span id="altura-1">1,76 m</span></li>
            <li class="list-group-item">🏃 Posição: <span id="posicao-1">Atacante</span></li>
            <li class="list-group-item">⭐ Rank: <span id="rank-1">9.1</span></li>
          </ul>
        </div>
      </div>

    </div>

    <div class="text-center mt-4">
      <button class="btn btn-success" onclick="add()">Adcionar Novo Jogador</button>
    </div>
  </div>

  <script>
	function add() {
    // Cria o novo card com os dados do Lucas Paquetá
    var novoCard = document.createElement("div");
    novoCard.className = "card";
    novoCard.style.width = "18rem";
 
    novoCard.innerHTML = 
        '<img src="img/Lucas_Paqueta.png" class="card-img-top" alt="Lucas Paquetá"/>' +
        '<div class="card-body">' +
            '<h5 class="card-title">Lucas Tolentino Coelho de Lima</h5>' +
            '<ul class="list-group list-group-flush">' +
                '<li class="list-group-item">📅 Data de Nasc.: <span>27/08/1997 (28 anos)</span></li>' +
                '<li class="list-group-item">📏 Altura: <span>1,80 m</span></li>' +
                '<li class="list-group-item">🏃 Posição: <span>Meio-campista</span></li>' +
                '<li class="list-group-item">⭐ Rank: <span>8.8</span></li>' +
            '</ul>' +
        '</div>';
 
    // Insere o novo card ao lado do card já existente
    document.getElementById("lista-jogadores").appendChild(novoCard);
}

 </script>
</body>
</html>
